<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultor Completo de CNPJs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { color: #2c3e50; margin-top: 0; }
        p { color: #666; }
        .painel-status {
            background-color: #e3f2fd;
            color: #0d47a1;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            border-left: 4px solid #1e88e5;
            display: none;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        /* NOVA CLASSE: Barra de Ações para alinhar os botões lado a lado */
        .action-bar {
            display: flex;
            gap: 15px; /* Espaçamento entre os botões */
            flex-wrap: wrap; /* Faz os botões quebrarem de linha em telas de celular */
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none; /* Caso use a tag <a> como botão */
        }

        /* Estilo do Botão Principal (Verde) */
        .btn-primary {
            background-color: #2ecc71;
            color: white;
        }
        .btn-primary:hover { 
            background-color: #27ae60; 
            transform: translateY(-1px); /* Sutil efeito de subir ao passar o mouse */
        }

        /* NOVO ESTILO: Botão Secundário para o Link Individual (Azul Escuro/Aço) */
        .btn-secondary {
            background-color: #34495e;
            color: white;
        }
        .btn-secondary:hover { 
            background-color: #2c3e50; 
            transform: translateY(-1px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background-color: #f8f9fa; color: #2c3e50; }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-simples { background-color: #ffeaa7; color: #d63031; }
        .badge-mei { background-color: #55efc4; color: #00b894; }
        .badge-outros { background-color: #dfe6e9; color: #636e72; }
        .badge-aguardando { background-color: #ffeaa7; color: #d35400; font-weight: normal; }
        .badge-timer { background-color: #dff9fb; color: #130cb7; border: 1px solid #c7ecee; }
    </style>
</head>
<body>

<div class="container">
    <h1>Consultor Completo de CNPJs</h1>
    <p>Fila de Inscrições Estaduais controlada por um temporizador em tempo real.</p>
    
    <div id="statusPainel" class="painel-status"></div>

    <textarea id="cnpjInput" placeholder="00000000000191, 12345678000199"></textarea>
    
    <!-- BARRA DE AÇÕES COM OS DOIS BOTÕES -->
    <div class="action-bar">
        <button class="btn-primary" onclick="executarConsultaHibrida()">
            Iniciar Consulta Inteligente
        </button>
        
        <!-- Botão direcionando para sua página existente usando a tag onclick do JS -->
        <button class="btn-secondary" onclick="window.open('consulta.html', '_blank')">
            Consulta Individual ↗
        </button>
    </div>

    <table>
        <thead>
            <tr>
                <th>CNPJ</th>
                <th>Razão Social</th>
                <th>Regime (Simples/MEI)</th>
                <th>Inscrição Estadual</th>
            </tr>
        </thead>
        <tbody id="resultsBody">
            <!-- Injeção via JS -->
        </tbody>
    </table>
</div>

<script>
async function executarConsultaHibrida() {
    const input = document.getElementById('cnpjInput').value;
    const statusPainel = document.getElementById('statusPainel');
    const tableBody = document.getElementById('resultsBody');
    
    const listaCnpjs = input.split(',')
        .map(cnpj => cnpj.replace(/\D/g, ''))
        .filter(cnpj => cnpj.length === 14);

    tableBody.innerHTML = '';
    
    if (listaCnpjs.length === 0) {
        alert('Insira CNPJs válidos.');
        return;
    }

    statusPainel.style.display = 'block';
    statusPainel.innerHTML = '<strong>Etapa 1:</strong> Buscando dados cadastrais na BrasilAPI...';

    // --- ETAPA 1: Dados Rápidos (BrasilAPI) ---
    for (const cnpj of listaCnpjs) {
        const row = document.createElement('tr');
        row.setAttribute('id', `row-${cnpj}`);
        const cnpjFmt = cnpj.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
        
        row.innerHTML = `
            <td>${cnpjFmt}</td>
            <td class="razao-social">Carregando...</td>
            <td class="regime">Carregando...</td>
            <td class="ie"><span class="badge badge-aguardando">Na fila...</span></td>
        `;
        tableBody.appendChild(row);

        try {
            const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
            if (!response.ok) throw new Error();
            const data = await response.json();

            let regime = '<span class="badge badge-outros">Outros Regimes</span>';
            if (data.opcao_pelo_mei) regime = '<span class="badge badge-mei">MEI</span>';
            else if (data.opcao_pelo_simples) regime = '<span class="badge badge-simples">Simples Nacional</span>';

            row.querySelector('.razao-social').innerText = data.razao_social;
            row.querySelector('.regime').innerHTML = regime;

        } catch (e) {
            row.querySelector('.razao-social').innerText = 'Erro ao buscar dados cadastrais.';
            row.querySelector('.regime').innerText = '-';
            row.querySelector('.ie').innerText = '-';
            row.setAttribute('data-erro', 'true');
        }
        await new Promise(r => setTimeout(r, 200));
    }

    // --- ETAPA 2: Inscrições Estaduais (CNPJ.ws) com Cronômetro Ativo ---
    statusPainel.innerHTML = '<strong>Etapa 2:</strong> Processando a fila de Inscrições Estaduais...';

    for (let i = 0; i < listaCnpjs.length; i++) {
        const cnpj = listaCnpjs[i];
        const row = document.getElementById(`row-${cnpj}`);

        if (row.getAttribute('data-erro') === 'true') continue;

        row.querySelector('.ie').innerHTML = '<strong>Buscando...</strong>';

        try {
            const response = await fetch(`https://publica.cnpj.ws/cnpj/${cnpj}`);
            if (response.status === 429) {
                row.querySelector('.ie').innerHTML = '<span style="color: #e67e22;">Bloqueio de IP</span>';
                continue;
            }

            const data = await response.json();
            let ieTexto = '<span style="color: #95a5a6;">Não possui/Isento</span>';

            if (data.estabelecimento && data.estabelecimento.inscricoes_estaduais && data.estabelecimento.inscricoes_estaduais.length > 0) {
                const ie = data.estabelecimento.inscricoes_estaduais[0].inscricao_estadual;
                const uf = data.estabelecimento.inscricoes_estaduais[0].estado.sigla;
                ieTexto = `<strong>${ie}</strong> (${uf})`;
            }

            row.querySelector('.ie').innerHTML = ieTexto;

        } catch (e) {
            row.querySelector('.ie').innerHTML = '<span style="color: #7f8c8d;">Erro</span>';
        }

        // --- LÓGICA DO TIMER RECOMENTADA ---
        if (i < listaCnpjs.length - 1) {
            let tempoRestante = 21; 
            const proximoCnpj = listaCnpjs[i + 1];
            const proximaRow = document.getElementById(`row-${proximoCnpj}`);

            while (tempoRestante > 0) {
                statusPainel.innerHTML = `<strong>Fila de Espera:</strong> Próxima requisição em ${tempoRestante} segundos...`;
                
                if (proximaRow && proximaRow.getAttribute('data-erro') !== 'true') {
                    proximaRow.querySelector('.ie').innerHTML = `
                        <span class="badge badge-timer">Aguardando vez (${tempoRestante}s)</span>
                    `;
                }

                await new Promise(r => setTimeout(r, 1000));
                tempoRestante--; 
            }
        }
    }

    statusPainel.innerHTML = '<strong>Concluído!</strong> Todos os CNPJs foram processados.';
    statusPainel.style.backgroundColor = '#d4edda';
    statusPainel.style.color = '#155724';
}
</script>

</body>
</html>
